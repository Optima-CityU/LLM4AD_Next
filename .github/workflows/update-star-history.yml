name: Update star history chart

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Optional owner/repo to chart for this run"
        required: false
        type: string
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pull-requests: write

env:
  STAR_HISTORY_REPOSITORY: ${{ github.event.inputs.repository || vars.STAR_HISTORY_REPOSITORY || github.repository }}
  STAR_HISTORY_PATH: docs/assets/star-history.svg

jobs:
  update-star-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate star history SVG
        run: python .github/scripts/generate_star_history_svg.py

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-star-history
          base: main
          title: "docs: update star history chart"
          commit-message: "docs: update star history chart"
          body: "Automatically updates the static star history chart image."
          add-paths: |
            docs/assets/star-history.svg
          delete-branch: true
