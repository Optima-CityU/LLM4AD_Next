name: Update live QR code

on:
  workflow_dispatch:
    inputs:
      qr_url:
        description: "Optional live QR base URL to use for this run"
        required: false
        type: string
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pull-requests: write

env:
  QR_URL: ${{ github.event.inputs.qr_url || vars.LIVE_QR_URL || 'https://llm4ad-next.cn/api/v1/live-qr/Ksndoq1l' }}
  QR_DIR: docs/assets
  QR_PREFIX: live-qr
  README_PATH: README.md

jobs:
  update-qr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download QR image
        run: |
          set -euo pipefail
          qr_image_url="${QR_URL%/}"
          if [ "${qr_image_url##*/}" != "image" ]; then
            qr_image_url="${qr_image_url}/image"
          fi

          mkdir -p "$QR_DIR"
          curl -fsSL --retry 3 --retry-delay 2 "$qr_image_url" -o /tmp/live-qr.png

          mime_type="$(file --mime-type -b /tmp/live-qr.png)"
          case "$mime_type" in
            image/png|image/jpeg|image/webp) ;;
            *)
              echo "Downloaded content is not an image: $mime_type from $qr_image_url"
              exit 1
              ;;
          esac

          mapfile -t qr_paths < <(
            grep -oE "${QR_DIR}/${QR_PREFIX}(-[0-9]{8}-[0-9]{6})?\.png" "$README_PATH" |
              sort -u
          )
          if [ "${#qr_paths[@]}" -ne 1 ]; then
            echo "Expected exactly one live QR image reference in $README_PATH."
            exit 1
          fi

          current_qr_path="${qr_paths[0]}"
          if [ -f "$current_qr_path" ] && cmp -s /tmp/live-qr.png "$current_qr_path"; then
            echo "QR image unchanged."
            exit 0
          fi

          timestamp="$(date -u +%Y%m%d-%H%M%S)"
          new_qr_path="${QR_DIR}/${QR_PREFIX}-${timestamp}.png"
          mv /tmp/live-qr.png "$new_qr_path"
          sed -i "s#${current_qr_path}#${new_qr_path}#g" "$README_PATH"
          find "$QR_DIR" -maxdepth 1 -type f -name "${QR_PREFIX}*.png" \
            ! -path "$new_qr_path" -delete

          echo "Updated $new_qr_path from $qr_image_url and removed old QR images."

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-live-qr
          base: main
          title: "docs: update live QR code"
          commit-message: "docs: update live QR code"
          body: "Automatically updates the live QR code image, refreshes the README reference, and removes the old image to avoid GitHub image caching."
          add-paths: |
            README.md
            docs/assets/live-qr*.png
          delete-branch: true
