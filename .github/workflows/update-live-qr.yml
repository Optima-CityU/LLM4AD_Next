name: Update live QR code

on:
  workflow_dispatch:
    inputs:
      qr_url:
        description: "Optional live QR base URL to use for this run"
        required: false
        type: string
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pull-requests: write

env:
  QR_URL: ${{ github.event.inputs.qr_url || vars.LIVE_QR_URL || 'https://llm4ad-next.cn/api/v1/live-qr/Ksndoq1l' }}
  QR_PATH: docs/assets/live-qr.png

jobs:
  update-qr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download QR image
        run: |
          set -euo pipefail
          qr_image_url="${QR_URL%/}"
          if [ "${qr_image_url##*/}" != "image" ]; then
            qr_image_url="${qr_image_url}/image"
          fi

          mkdir -p "$(dirname "$QR_PATH")"
          curl -fsSL --retry 3 --retry-delay 2 "$qr_image_url" -o /tmp/live-qr.png

          mime_type="$(file --mime-type -b /tmp/live-qr.png)"
          case "$mime_type" in
            image/png|image/jpeg|image/webp) ;;
            *)
              echo "Downloaded content is not an image: $mime_type from $qr_image_url"
              exit 1
              ;;
          esac

          if [ -f "$QR_PATH" ] && cmp -s /tmp/live-qr.png "$QR_PATH"; then
            echo "QR image unchanged."
            exit 0
          fi

          mv /tmp/live-qr.png "$QR_PATH"
          echo "Updated $QR_PATH from $qr_image_url."

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-live-qr
          base: main
          title: "docs: update live QR code"
          commit-message: "docs: update live QR code"
          body: "Automatically updates the live QR code image."
          add-paths: |
            docs/assets/live-qr.png
          delete-branch: true
