name: Release Versioned Images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, for example v1.12.0"
        required: true
        type: string
      release_notes:
        description: "Optional release notes to prepend before the generated changelog"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'noah2012' }}
  BACKEND_IMAGE_NAME: ${{ vars.DOCKERHUB_BACKEND_IMAGE || 'backend' }}
  FRONTEND_IMAGE_NAME: ${{ vars.DOCKERHUB_FRONTEND_IMAGE || 'frontend' }}
  TASK_RUNNER_IMAGE_NAME: ${{ vars.DOCKERHUB_TASK_RUNNER_IMAGE || 'llm4ad-task-runner' }}

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_no_v: ${{ steps.version.outputs.version_no_v }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0

      - name: Prepare release version
        id: version
        env:
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must match vX.Y.Z, got: $version" >&2
            exit 1
          fi

          git fetch --tags origin
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
              echo "Tag already exists: ${version}" >&2
              exit 1
            fi
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Validate Python package version
        env:
          VERSION_NO_V: ${{ steps.version.outputs.version_no_v }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import re
          import sys
          import tomllib
          import urllib.error
          import urllib.request

          expected = os.environ["VERSION_NO_V"]
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          project_version = project["version"]
          if project_version != expected:
              raise SystemExit(
                  f"pyproject.toml version {project_version!r} does not match release {expected!r}"
              )

          init_text = Path("src/llm4ad/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', init_text, re.MULTILINE)
          if not match:
              raise SystemExit("src/llm4ad/__init__.py does not define __version__")
          package_version = match.group(1)
          if package_version != expected:
              raise SystemExit(
                  f"src/llm4ad/__init__.py version {package_version!r} does not match release {expected!r}"
              )

          def normalize_version(value: str) -> tuple[object, ...]:
              public = value.split("+", 1)[0].lower()
              parts: list[object] = []
              for part in re.split(r"[._-]", public):
                  if not part:
                      continue
                  parts.append(int(part) if part.isdigit() else part)
              while parts and parts[-1] == 0:
                  parts.pop()
              return tuple(parts)

          url = "https://pypi.org/pypi/llm4ad/json"
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  data = {"releases": {}}
              else:
                  raise

          expected_normalized = normalize_version(expected)
          for published_version, files in data.get("releases", {}).items():
              if files and normalize_version(published_version) == expected_normalized:
                  raise SystemExit(
                      f"PyPI version conflict: llm4ad {published_version!r} already exists"
                  )

          print(f"Validated Python package version {expected}; no PyPI version conflict found.")
          PY

  docker:
    name: Publish versioned Docker images
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "${DOCKERHUB_NAMESPACE}" || {
            echo "Set repository variable DOCKERHUB_NAMESPACE or use the default noah2012 namespace." >&2
            exit 1
          }
          test -n "${DOCKERHUB_USERNAME}" || {
            echo "Set repository secret DOCKERHUB_USERNAME." >&2
            exit 1
          }
          test -n "${DOCKERHUB_TOKEN}" || {
            echo "Set repository secret DOCKERHUB_TOKEN." >&2
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract backend metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.version_no_v }}
            type=sha,prefix=sha-,format=short

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/backend/Dockerfile
          push: true
          build-args: |
            UV_INDEX_URL=${{ vars.UV_INDEX_URL }}
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Extract task runner metadata
        id: task-runner-meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.TASK_RUNNER_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.version_no_v }}
            type=sha,prefix=sha-,format=short

      - name: Build and push task runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/backend/Dockerfile.task
          push: true
          build-args: |
            APT_MIRROR=${{ vars.APT_MIRROR }}
            UV_INDEX_URL=${{ vars.UV_INDEX_URL }}
          tags: ${{ steps.task-runner-meta.outputs.tags }}
          labels: ${{ steps.task-runner-meta.outputs.labels }}
          cache-from: type=gha,scope=task-runner
          cache-to: type=gha,mode=max,scope=task-runner

      - name: Extract frontend metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.version_no_v }}
            type=sha,prefix=sha-,format=short

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=
            VITE_CODE_SERVER_URL=${{ vars.VITE_CODE_SERVER_URL || '/code_ide' }}
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  pypi:
    name: Publish Python package to PyPI
    runs-on: ubuntu-latest
    needs: [prepare, docker]
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Publish Git tag and GitHub release
    runs-on: ubuntu-latest
    needs: [prepare, docker, pypi]
    permissions:
      contents: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0

      - name: Push release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_VERSION}" -m "Release ${RELEASE_VERSION}"
          git push origin "refs/tags/${RELEASE_VERSION}"

      - name: Create GitHub release
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_NOTES_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || '' }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const version = process.env.RELEASE_VERSION;
            const generated = await github.rest.repos.generateReleaseNotes({
              owner,
              repo,
              tag_name: version,
            });
            const manualNotes = process.env.RELEASE_NOTES_INPUT.trim();
            const body = manualNotes
              ? `${manualNotes}\n\n${generated.data.body}`
              : generated.data.body;

            try {
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: version,
                name: `LLM4AD_Next ${version}`,
                body,
              });
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }
              const existing = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: version,
              });
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existing.data.id,
                name: `LLM4AD_Next ${version}`,
                body,
              });
            }
