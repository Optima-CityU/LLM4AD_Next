name: CI
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        #os: [ubuntu-latest, macos-latest]
        # Recommended interpreter. agentscope (chatv2) is a base dep on >=3.11, so it
        # is installed here and the agent module is type-checked by the mypy step.
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4
      name: Checkout code

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --all-extras --python ${{ matrix.python-version }}

    - name: Run ruff lint
      run: uv run --python ${{ matrix.python-version }} ruff check src/ 

    - name: Run type checking with mypy
      run: uv run --python ${{ matrix.python-version }} mypy src/llm4ad/

    - name: Run tests with coverage
      run: uv run --python ${{ matrix.python-version }} pytest tests/ -m unit --cov=src/llm4ad --cov-report=xml --cov-report=term

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.os }}-${{ matrix.python-version }}
        path: coverage.xml
      if: success()

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v4

    - name: Download coverage reports
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-report-*
        merge-multiple: true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: E2E Tests (Sorting Benchmark)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      name: Checkout code

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y g++

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --all-extras --python 3.12

    - name: Run e2e tests
      run: uv run --python 3.12 pytest tests/e2e/ -m e2e -v
