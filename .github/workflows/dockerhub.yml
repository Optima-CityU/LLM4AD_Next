name: Build and Push Docker Hub Images

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dockerhub:
    name: Build and push Docker Hub latest images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME || 'noah2012' }}
      BACKEND_IMAGE_NAME: ${{ vars.DOCKERHUB_BACKEND_IMAGE || 'backend' }}
      FRONTEND_IMAGE_NAME: ${{ vars.DOCKERHUB_FRONTEND_IMAGE || 'frontend' }}
      TASK_RUNNER_IMAGE_NAME: ${{ vars.DOCKERHUB_TASK_RUNNER_IMAGE || 'llm4ad-task-runner' }}
      MINDMEMOS_IMAGE_NAME: ${{ vars.DOCKERHUB_MINDMEMOS_IMAGE || 'llm4ad-mindmemos' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate project version
        run: python scripts/project_version.py --check

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "${DOCKERHUB_NAMESPACE}" || {
            echo "Set repository secret DOCKERHUB_USERNAME or variable DOCKERHUB_NAMESPACE." >&2
            exit 1
          }
          test -n "${DOCKERHUB_USERNAME}" || {
            echo "Set repository secret DOCKERHUB_USERNAME." >&2
            exit 1
          }
          test -n "${DOCKERHUB_TOKEN}" || {
            echo "Set repository secret DOCKERHUB_TOKEN." >&2
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract backend metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/backend/Dockerfile
          push: true
          build-args: |
            UV_INDEX_URL=${{ vars.UV_INDEX_URL }}
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Extract task runner metadata
        id: task-runner-meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.TASK_RUNNER_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push task runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/backend/Dockerfile.task
          push: true
          build-args: |
            APT_MIRROR=${{ vars.APT_MIRROR }}
            UV_INDEX_URL=${{ vars.UV_INDEX_URL }}
          tags: ${{ steps.task-runner-meta.outputs.tags }}
          labels: ${{ steps.task-runner-meta.outputs.labels }}
          cache-from: type=gha,scope=task-runner
          cache-to: type=gha,mode=max,scope=task-runner

      - name: Extract MindMemOS metadata
        id: mindmemos-meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.MINDMEMOS_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push MindMemOS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/mindmemos/Dockerfile
          push: true
          build-args: |
            UV_INDEX_URL=${{ vars.UV_INDEX_URL }}
          tags: ${{ steps.mindmemos-meta.outputs.tags }}
          labels: ${{ steps.mindmemos-meta.outputs.labels }}
          cache-from: type=gha,scope=mindmemos
          cache-to: type=gha,mode=max,scope=mindmemos

      - name: Extract frontend metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=
            VITE_CODE_SERVER_URL=${{ vars.VITE_CODE_SERVER_URL || '/code_ide' }}
            VITE_FOOTER_BEIAN=${{ vars.VITE_FOOTER_BEIAN || '' }}
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
