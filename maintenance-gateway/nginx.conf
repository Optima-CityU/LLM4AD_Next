# LLM4AD 维护网关 nginx 配置（容器内）
#
# 作为常驻公开入口监听 80，反代到 frontend 容器发布的宿主端口
# (host.docker.internal:18039)。属于独立 compose 项目，与主栈隔离：
# 主栈 stop/up/down 都不影响本容器，80 端口始终在线，部署窗口内展示维护页。
#
# 维护开关：flag/MAINTENANCE 文件（bind 挂载到 /flag）存在即整站返回维护页。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 100m;

    # 维护页静态资源
    root /usr/share/nginx/html;

    # 标志文件存在即进入整站维护：返回 503 触发 error_page。
    # if (-f) 每请求实时判断，touch/rm flag/MAINTENANCE 即时生效（见 maint.sh）。
    if (-f /flag/MAINTENANCE) {
        return 503;
    }

    # 维护页静态文件：精确匹配，始终直出（不经反代）。
    # 供前端 iframe 稳定加载——维护开启时走 error_page，关闭时也直接出静态文件，
    # 规避维护开关切换瞬间 iframe 串到后端内容的竞态。
    location = /maintenance.html {
    }

    location / {
        # frontend 容器发布在宿主 18039，经 host-gateway 访问；IP 稳定，无需 resolver。
        proxy_pass http://host.docker.internal:18039;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE（/api）与 WebSocket（/code_ide）透传。frontend 容器内部仍按各自
        # location 做限流 / gzip / 安全头，此处只做整体透传。
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 整站维护页：所有 503 都返回自包含的 maintenance.html
    error_page 503 @maintenance;
    location @maintenance {
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        # 维护专属标记：前端拦截器只认带此头的 503，避免把后端偶发 503 误判为维护。
        add_header X-Maintenance 1 always;

        # 非 GET/HEAD（PUT/DELETE/PATCH 等 XHR）：nginx 静态文件模块不接受这些方法，
        # 走 rewrite 会被静态处理器判 405，覆盖掉 503。这类请求是接口调用，前端只看
        # 503 + X-Maintenance 头，不需要 HTML 响应体，故直接 return 503。
        # recursive_error_pages 默认 off，此处 return 不会重新触发 error_page，不会死循环。
        if ($request_method !~ ^(GET|HEAD)$) {
            return 503;
        }

        # GET/HEAD：浏览器导航，渲染自包含维护页（静态文件，GET 合法）。
        rewrite ^ /maintenance.html break;
    }
}
