# ---- Rate Limiting Zones ----
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_register:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=api_verify:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserve HTTP keepalive for regular API requests while upgrading WebSockets.
map $http_upgrade $api_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
  listen 80;

  # Docker embedded DNS, re-resolve on every request
  resolver 127.0.0.11 valid=10s;

  # ---- Security Headers ----
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ---- Connection & Body Limits ----
  limit_conn conn_limit 50;
  client_max_body_size 100m;

  # ---- Gzip Compression ----
  # The stock nginx image enables `gzip on` but only compresses text/html,
  # so JS/CSS bundles ship uncompressed by default. Declare the types
  # explicitly to compress the heavy vendor chunks (monaco, d3, echarts...).
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    image/svg+xml
    font/ttf
    font/otf
    application/vnd.ms-fontobject;

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
  }

  # ---- Media: short-cache + Range support (seek / progressive playback) ----
  # These files have fixed (non-hashed) names, so keep the cache short and avoid
  # `immutable` — that way replacing the video/poster later is picked up quickly.
  # Accept-Ranges lets the browser seek and stream without fetching the whole
  # file up front. Never gzip these — already compressed and gzip breaks Range.
  location ~* \.(mp4|webm|webp)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=3600";
    add_header Accept-Ranges bytes;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
