# ---- Authentication endpoints: strict rate limiting ----
location /api/v1/login/ {
    limit_req zone=api_auth burst=3 nodelay;
    limit_req_status 429;
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---- Registration: strict rate limiting ----
location /api/v1/users/signup {
    limit_req zone=api_register burst=2 nodelay;
    limit_req_status 429;
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---- Password recovery: strict rate limiting ----
location /api/v1/password-recovery/ {
    limit_req zone=api_register burst=1 nodelay;
    limit_req_status 429;
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---- Email verification: moderate rate limiting ----
location /api/v1/users/verify-email {
    limit_req zone=api_verify burst=2 nodelay;
    limit_req_status 429;
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/v1/users/resend-verify-code {
    limit_req zone=api_verify burst=2 nodelay;
    limit_req_status 429;
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---- General API: moderate rate limiting with SSE support ----
location /api {
    limit_req zone=api_general burst=60 nodelay;
    limit_req_status 429;
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE support
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
}

# ---- Block API docs in production ----
location /docs {
    return 404;
}

location /redoc {
    return 404;
}
