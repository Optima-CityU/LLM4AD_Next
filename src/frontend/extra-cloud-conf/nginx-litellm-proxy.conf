# 精确匹配 /litellm，并重定向到带斜杠的版本
location = /litellm {
    return 301 /litellm/;
}

# 仅匹配 /litellm/ 前缀（斜杠是关键）
location ^~ /litellm/ {
    set $litellm_upstream http://litellm:4000;
    proxy_pass $litellm_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /litellm;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    proxy_redirect off;
}

# 防御性拒绝 /litellm_proxy 直接访问（防止未来配置错误）
location ^~ /litellm_proxy/ {
    return 403;
}
