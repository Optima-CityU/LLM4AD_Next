<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phonefarm · 设备屏幕</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #232b36; --fg: #e6edf3;
    --dim: #8b949e; --accent: #3fb950; --warn: #d29922; --ripple: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex; justify-content: center; padding: 24px; min-height: 100vh;
  }
  .wrap { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  /* ── 手机外壳 ── */
  .shell {
    position: relative; background: #05070a; border: 1px solid var(--line);
    border-radius: 34px; padding: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.55);
  }
  .screen {
    position: relative; border-radius: 22px; overflow: hidden;
    background: #000; display: grid; place-items: center;
  }
  .screen img { display: block; width: 100%; height: auto; }
  .screen.stale img { opacity: .45; filter: grayscale(1); }
  .placeholder {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--dim); font-size: 12px; text-align: center; padding: 20px;
  }
  /* ── 点击/拖动提示 ── */
  .layer { position: absolute; inset: 0; pointer-events: none; }
  .ripple {
    position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border: 2px solid var(--ripple); border-radius: 50%;
    animation: pop .7s ease-out forwards;
  }
  .ripple.swipe { border-color: var(--warn); border-style: dashed; }
  @keyframes pop {
    from { transform: scale(.25); opacity: .95; }
    to   { transform: scale(1.5); opacity: 0; }
  }
  .trail {
    position: absolute; height: 2px; background: var(--warn);
    transform-origin: 0 50%; animation: fade 1.1s ease-out forwards;
  }
  @keyframes fade { from { opacity: .85; } to { opacity: 0; } }
  /* ── 侧栏 ── */
  aside { width: 280px; display: flex; flex-direction: column; gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .panel h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .12em;
              text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
  .row span:first-child { color: var(--dim); }
  .row span:last-child { text-align: right; word-break: break-all; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
         background: var(--accent); margin-right: 6px; vertical-align: middle; }
  .dot.off { background: #f85149; }
  .dot.paused { background: var(--warn); }
  button {
    background: #21262d; color: var(--fg); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 10px; font: inherit; cursor: pointer; flex: 1;
  }
  button:hover { background: #2d333b; }
  button:active { transform: translateY(1px); }
  .btns { display: flex; gap: 8px; }
  .note { color: var(--dim); font-size: 11px; line-height: 1.6; margin-top: 6px; }
  .warn { color: var(--warn); }
  #events { max-height: 190px; overflow: auto; }
  #events div { display: flex; gap: 8px; padding: 1px 0; color: var(--dim); }
  #events b { color: var(--fg); font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <div class="shell">
    <div class="screen" id="screen">
      <div class="placeholder" id="ph">等待第一帧…</div>
      <img id="frame" alt="" hidden>
      <div class="layer" id="layer"></div>
    </div>
  </div>

  <aside>
    <div class="panel">
      <h2>连接</h2>
      <div class="row"><span>状态</span><span id="status"><i class="dot"></i>连接中</span></div>
      <div class="row"><span>设备</span><span id="serial">—</span></div>
      <div class="row"><span>分辨率</span><span id="res">—</span></div>
      <div class="row"><span>预览</span><span id="fps">—</span></div>
      <div class="row"><span>最后画面</span><span id="age">尚未收到</span></div>
      <div class="row"><span>正在观看</span><span id="viewers">—</span></div>
      <div class="note" id="capture-reason" role="status"></div>
    </div>

    <div class="panel">
      <h2>操作</h2>
      <div class="btns">
        <button id="pause">暂停</button>
        <button id="shot">存图</button>
      </div>
      <div class="note">
        观战窗口，只读。暂停、隐藏或关闭本窗口后停止订阅；其他窗口仍可观看。
        连接丢失后订阅在 5 秒内过期，已开始的截图可能随后完成。<br>
        <strong>screencap 会影响帧时与功耗；每帧取得观察租约，测量占用时自动暂缓。</strong>
        帧间释放租约，单帧最多 20 秒；截图超时会保留恢复屏障。旧图保留并显示时间。
      </div>
    </div>

    <div class="panel">
      <h2>最近动作</h2>
      <div id="events"><div style="color:var(--dim)">—</div></div>
    </div>
  </aside>
</div>

<script>
// ── 配置由服务端注入(没注入就用默认) ──
const CFG = { interval_ms: 700, heartbeat_ms: 1000, viewer_ttl_ms: 5000,
              fresh_for_ms: 2100, actions_wired: false, ...(window.__PF__ || {}) };
const $ = (id) => document.getElementById(id);
const frame = $("frame"), ph = $("ph"), layer = $("layer"), screenEl = $("screen");
let paused = false, pageClosed = false, viewerId = null, generation = 0;
let maintenanceInFlight = false, frameRequest = null;
let afterSeq = 0, lastFrameSeq = 0, lastFrameAt = 0, lastFrameAge = 0;
let frameCount = 0, fpsAt = Date.now(), lastEventSeq = 0;
let frameW = 0, frameH = 0;
let captureInfo = { state: "idle", reason: null, frames: 0 };
const wantsFrames = () => !paused && !pageClosed && document.visibilityState !== "hidden";

function setStatus(text, cls) {
  const dot = document.createElement("i");
  dot.className = `dot ${cls || ""}`;
  $("status").replaceChildren(dot, document.createTextNode(text));
}

function captureStatus(fallback, cls) {
  if (!wantsFrames()) return;
  if (captureInfo.state === "deferred" || captureInfo.state === "error") {
    screenEl.classList.add("stale");
    setStatus(captureInfo.state === "deferred" ? "租约暂缓" : "采集失败",
              captureInfo.state === "deferred" ? "paused" : "off");
    $("capture-reason").textContent = captureInfo.reason || "等待采集状态更新";
    return;
  }
  $("capture-reason").textContent = "";
  if (fallback) setStatus(fallback, cls);
}

function release(id) {
  if (!id) return;
  const url = `/watch/stop?id=${encodeURIComponent(id)}`;
  // Beacon can survive pagehide; if it is lost the server's TTL is the fallback.
  if (!navigator.sendBeacon || !navigator.sendBeacon(url)) {
    fetch(url, { method: "POST", keepalive: true }).catch(() => {});
  }
}

function stopWatching() {
  generation++;
  const id = viewerId;
  viewerId = null;
  if (frameRequest) frameRequest.abort();
  release(id);
  screenEl.classList.add("stale");
  setStatus(paused ? "本窗口已暂停" : "本窗口未观看", "paused");
}

async function maintainSubscription() {
  if (!wantsFrames() || maintenanceInFlight) return;
  maintenanceInFlight = true;
  const revision = generation, id = viewerId;
  try {
    const path = id ? `/watch/heartbeat?id=${encodeURIComponent(id)}` : "/watch/start";
    const r = await fetch(path, { method: "POST", signal: AbortSignal.timeout(3000) });
    if (id && r.status === 410) {
      if (revision === generation && viewerId === id) {
        viewerId = null;
        screenEl.classList.add("stale");
        setStatus("订阅已过期，重新连接", "off");
      }
      return;
    }
    if (!r.ok) throw new Error("HTTP " + r.status);
    if (!id) {
      const j = await r.json();
      // A start reply may arrive after pause/pagehide. Release its new handle;
      // heartbeats never recreate a released subscription on the server.
      if (revision !== generation || !wantsFrames()) { release(j.id); return; }
      viewerId = j.id;
      afterSeq = j.after_seq;
      lastFrameSeq = afterSeq;
      frameCount = 0; fpsAt = Date.now();
      screenEl.classList.add("stale");
      captureStatus("等待新画面", "paused");
      tick();
    }
  } catch (e) {
    if (revision === generation && wantsFrames()) setStatus("连接中断，正在重试", "off");
  } finally {
    maintenanceInFlight = false;
  }
}

// GET requests do not renew a subscription. An abandoned frame request cannot
// keep the producer alive, and a late frame cannot undo the user's pause.
async function tick() {
  if (!wantsFrames() || !viewerId || frameRequest) return;
  const revision = generation, id = viewerId, started = Date.now();
  const controller = new AbortController();
  frameRequest = controller;
  const timeout = setTimeout(() => controller.abort(), 3000);
  let url = null;
  try {
    const r = await fetch(`/frame.jpg?after=${afterSeq}`, { cache: "no-store", signal: controller.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const seq = Number(r.headers.get("X-Frame-Seq"));
    let age = Number(r.headers.get("X-Frame-Age-Ms")) + Date.now() - started;
    if (!Number.isFinite(seq) || !Number.isFinite(age) || age >= CFG.fresh_for_ms) throw new Error("stale frame");
    if (seq <= lastFrameSeq) return; // Cached repeats are not new frames or new FPS.
    url = URL.createObjectURL(await r.blob());
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    if (revision !== generation || !wantsFrames() || viewerId !== id) return;
    age = Number(r.headers.get("X-Frame-Age-Ms")) + Date.now() - started;
    if (age >= CFG.fresh_for_ms) throw new Error("frame expired during transfer");
    frameW = img.naturalWidth; frameH = img.naturalHeight;
    const old = frame.src;
    frame.src = url;
    url = null;
    frame.hidden = false; ph.hidden = true;
    if (old && old.startsWith("blob:")) URL.revokeObjectURL(old);
    lastFrameSeq = seq;
    lastFrameAt = Date.now(); lastFrameAge = age;
    frameCount++;
    if (Date.now() - fpsAt > 2000) {
      $("fps").textContent = (frameCount / ((Date.now() - fpsAt) / 1000)).toFixed(1) + " fps";
      frameCount = 0; fpsAt = Date.now();
    }
    if (seq > captureInfo.frames) captureInfo = { state: "ready", reason: null, frames: seq };
    screenEl.classList.remove("stale");
    captureStatus("观看中", "");
  } catch (e) {
    if (revision === generation && wantsFrames()) {
      screenEl.classList.add("stale");
      captureStatus("等待新画面", "off");
    }
  } finally {
    if (url) URL.revokeObjectURL(url);
    clearTimeout(timeout);
    frameRequest = null;
  }
}

function freshness() {
  if (!lastFrameAt) return;
  const age = Date.now() - lastFrameAt + lastFrameAge;
  $("age").textContent = (age / 1000).toFixed(1) + " 秒前";
  if (age >= CFG.fresh_for_ms) {
    screenEl.classList.add("stale");
    if (wantsFrames()) captureStatus("画面已过期，等待更新", "off");
  }
}

async function state() {
  try {
    const s = await (await fetch("/state.json", { cache: "no-store", signal: AbortSignal.timeout(3000) })).json();
    $("serial").textContent = s.serial || "—";
    $("res").textContent = s.width ? `${s.width}×${s.height}` : "—";
    $("viewers").textContent = `${s.active_viewers} 个窗口`;
    // A delayed state response must not overwrite a newer frame's state.
    if (Number(s.frames) >= lastFrameSeq) {
      captureInfo = { ...(s.capture || { state: s.error ? "error" : "idle", reason: s.error }), frames: Number(s.frames) };
      captureStatus();
    }
  } catch (e) {}
}

// ── 动作涟漪: 从 /events.json 拉最近动作, 在画面上画出来 ──
// 坐标是 0~1 的归一化值, 由服务端从设备像素换算 —— 前端不猜缩放。
function ripple(ev) {
  if (!frameW) return;
  const px = (nx) => nx * frame.clientWidth;
  const py = (ny) => ny * frame.clientHeight;
  if (ev.a === "swipe" && ev.x2 != null) {
    const x1 = px(ev.x), y1 = py(ev.y), x2 = px(ev.x2), y2 = py(ev.y2);
    const len = Math.hypot(x2 - x1, y2 - y1);
    const ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
    const t = document.createElement("div");
    t.className = "trail";
    t.style.cssText = `left:${x1}px;top:${y1}px;width:${len}px;transform:rotate(${ang}deg)`;
    layer.appendChild(t);
    setTimeout(() => t.remove(), 1100);
  }
  const r = document.createElement("div");
  r.className = "ripple" + (ev.a === "swipe" ? " swipe" : "");
  r.style.left = px(ev.x) + "px";
  r.style.top = py(ev.y) + "px";
  layer.appendChild(r);
  setTimeout(() => r.remove(), 700);
}

async function events() {
  if (!CFG.actions_wired || !wantsFrames() || !viewerId) return;
  try {
    const es = await (await fetch(`/events.json?since=${lastEventSeq}`, { cache: "no-store" })).json();
    for (const ev of es.events || []) {
      if (ev.seq > lastEventSeq) { lastEventSeq = ev.seq; ripple(ev); }
    }
    if (es.events && es.events.length) renderEvents(es.events);
  } catch (e) {}
}

function renderEvents(list) {
  const box = $("events");
  const recent = list.slice(-12).reverse();
  if (!recent.length) return;
  box.innerHTML = recent.map((e) => {
    const where = e.a === "swipe"
      ? `(${e.x},${e.y})→(${e.x2},${e.y2})`
      : (e.x != null ? `(${e.x},${e.y})` : "");
    const what = e.text ? ` “${String(e.text).slice(0, 18)}”` : (e.what ? ` ${e.what}` : "");
    return `<div><b>${e.a}</b><span>${where}${what}</span></div>`;
  }).join("");
}

// ── 控件 ──
$("pause").onclick = () => {
  paused = !paused;
  $("pause").textContent = paused ? "继续" : "暂停";
  if (paused) stopWatching(); else maintainSubscription();
};
$("shot").onclick = async () => {
  try {
    const r = await fetch("/screenshot", { method: "POST" });
    const j = await r.json();
    $("shot").textContent = j.ok ? "已存" : "失败";
  } catch (e) { $("shot").textContent = "失败"; }
  setTimeout(() => { $("shot").textContent = "存图"; }, 1400);
};
// 窗口尺寸变了, 涟漪的定位基准跟着变 —— 清掉旧的
addEventListener("resize", () => { layer.innerHTML = ""; });

document.addEventListener("visibilitychange", () => {
  if (!wantsFrames()) stopWatching(); else maintainSubscription();
});
addEventListener("pagehide", () => { pageClosed = true; stopWatching(); });
addEventListener("pageshow", () => { pageClosed = false; maintainSubscription(); });

// ── 主循环 ──
setInterval(maintainSubscription, CFG.heartbeat_ms);
setInterval(tick, CFG.interval_ms);
setInterval(state, 3000);
setInterval(events, 500);
setInterval(freshness, 500);
maintainSubscription(); state(); events();
</script>
</body>
</html>
