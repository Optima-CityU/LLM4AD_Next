telemetry:
  enabled: false
  telemetry_endpoint: http://mindmemos-otel-collector:4318
  telemetry_timeout: 30
  service_name: mindmemos
  span_type: batch
  logs_enabled: false
  trace_sampling_ratio: 1.0
  max_queue_size: 10240
  max_export_batch_size: 256
  log_level: INFO
  metric_export_interval_millis: 5000

auth:
  mode: gateway_jwt
  api_key_file: api_keys.yaml
  gateway_jwt_secret: demo-jwt-secret-key
  gateway_jwt_issuer: demo-jwt-gateway
  gateway_jwt_audience: demo-jwt-audience

# Fill these routers with real endpoints before running real add/search.
# Empty routers let the local API start for wiring and health checks.
chat_model_router:
  routing_strategy: simple-shuffle
  endpoints: []

embed_model_router:
  routing_strategy: simple-shuffle
  endpoints: []

rerank_model_router:
  routing_strategy: simple-shuffle
  endpoints: []

database:
  qdrant:
    url: http://mindmemos-qdrant:6333
    grpc_port: 6334
    prefer_grpc: true
    vector_size: 1024
    project_collection_namespace_enabled: true
    auto_create: true

  neo4j:
    uri: bolt://mindmemos-neo4j:7687
    username: neo4j
    password: mindmemos_dev_password
    database: neo4j
    auto_create_schema: true

  default_consistency: fast

provider_binding:
  enabled: true

kafka:
  enabled: true
  bootstrap_servers: mindmemos-kafka:29092

pipelines:
  get: default_get
  delete: default_delete
  update: default_update
  feedback: default_feedback

algo_config:
  common:
    prompt_language: EN
  add:
    structured:
      extraction:
        selection_enabled: true
        coverage_validation_enabled: true
        max_coverage_items: 12
      dedup:
        # Detailed source artifacts can embed below a shorter historical
        # summary even when both describe the same card. Keep those candidates
        # eligible for the bounded relation classifier.
        create_below: 0.70
    schema:
      entity_modeling_path: config/mindmemos/presets/llm4ad_memory_card.json
    vanilla:
      enable_entities: false
  search:
    structured:
      min_relevance_score: 0.35
    vanilla:
      use_reranker: false
      graph_enabled: false
      shared_entity_graph_enabled: false
    rerank:
      enabled: false
