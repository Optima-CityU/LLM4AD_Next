# LLM4AD Debug Configuration - Fast pipeline validation for MEoH TSP
# Minimal params to verify the full pipeline loop (init -> evolve -> survival -> output)

project_name: "tsp_debug"

# Short descriptions for frontend display (English / Chinese)
description_en: "Minimal MEoH debug run validating the full TSP pipeline end-to-end on a single instance."
description_zh: "最小化的 MEoH 调试配置，使用单个实例端到端验证完整 TSP 进化流水线。"

background: |
  Debug run: quickly verify the MEoH pipeline end-to-end on TSP.
  IMPORTANT CONSTRAINT: You may ONLY use the Python standard library and numpy.
  Do NOT import scipy, sklearn, networkx, ortools, or any other third-party package.
  Any solution using unavailable packages will fail immediately.

base_dir: "./runs"
random_seed: 42

providers:
  - name: "default"
    type: "openai_compatible"
    base_url: ${LLM_BASE_URL}
    api_key: ${LLM_API_KEY}
    model: ${LLM_MODEL}
    temperature: 1.2
    max_tokens: 4096
    timeout: 120.0

evaluator:
  module: "tsp_evaluator.py:PythonTSPEvaluator"
  timeout: 180.0
  max_retries: 2
  parallel: true
  # batch_size: 2  # Not yet used by dispatcher — concurrency controlled by max_workers
  max_workers: 4
  dataset:
    mode: "files"
    files:
      - "data/small/instance_001.json"
  metrics:
    - "tour_length"
    - "candidate_runtime_ms"
    - "evaluation_total_ms"
    - "valid_tour"
  timing_metrics:
    enabled: true
    include_in_score: false
    score_components:
      - "candidate_runtime_ms"
    aggregation: "sum"
    weights:
      candidate_runtime_ms: 0.1

evolution:
  type: "meoh"
  planner_type: "meoh_evolution"
  max_llm_concurrency: 4
  max_generations: 3
  max_sample_nums: 80
  checkpoint_interval: 1
  max_checkpoints: 5
  early_stop_patience: 5
  early_stop_threshold: 1e-6

  population_size: 5
  selection_num: 2
  num_samplers: 1

  objective_metrics:
    - "tour_length"
    - "candidate_runtime_ms"

  use_e2_operator: true
  use_m1_operator: true
  use_m2_operator: true

  generation_mode: "survival"

  batch_per_operator: true

coder:
  type: "custom"
  provider: "default"
  provider_name: "openai"
  timeout: 180.0
  max_retries: 1
  temperature: 1.3
  max_gen_tokens: 4096

planner:
  mask_evolve_blocks: true

memory:
  embedding_dim: 768
  max_entries: 100
  similarity_threshold: 0.8
  decay_factor: 0.99
  auto_extraction:
    enabled: false

logging:
  level: "INFO"
  console: true
  json_format: false

version_control:
  enabled: true
  type: "git_worktree"
  local_path: "./tsp_algorithm"
  auto_initialize: true
  auto_cleanup: true

repo_analyzer:
  type: "evolve_detector"
  context_lines_before: 5
  context_lines_after: 50
  include: ["*.py"]
  exclude: [".git/**", "__pycache__/**", "*.pyc"]
