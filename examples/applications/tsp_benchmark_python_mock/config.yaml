# ==============================================================================
# LLM4AD Configuration for TSP Benchmark (Mock Provider)
# ==============================================================================

# ==============================================================================
# SECTION 1: General Settings (通用设置)
# ==============================================================================
# Project name, used for output directory organization
project_name: "tsp_benchmark_python_mock"

# Short descriptions for frontend display (English / Chinese)
description_en: "Mock TSP run that uses a fake LLM provider for offline pipeline testing without real API calls."
description_zh: "使用模拟 LLM 提供者的 TSP 测试配置，无需真实 API 调用即可离线跑通完整流水线。"

# Background description of the task, passed to LLM for context
background: |
  This is a mock test for the TSP (Travelling Salesman Problem) benchmark.
  It uses a mock LLM provider that returns hardcoded algorithm variants
  without making any real API calls, allowing the full pipeline to run
  offline for testing and debugging purposes.

# Random seed for reproducibility across all components
random_seed: 42

# Base working directory where the task directory will be created
base_dir: "./runs"

# ==============================================================================
# SECTION 1.5: Workspace Configuration (工作空间配置)
# ==============================================================================
workspace:
  # Create task directory structure automatically at startup
  # Structure: {base_dir}/{project_name}/{run_id}/
  auto_create: true

  # Subdirectory names within the task directory
  subdirs:
    output: "output"
    logs: "logs"
    checkpoints: "checkpoints"
    generated: "generated"
    cache: "cache"
    temp: "temp"

# ==============================================================================
# SECTION 2: LLM Provider Configuration (LLM 提供者配置)
# ==============================================================================
providers:
  - name: "mock"
    type: "mock"
    base_url: ""
    api_key: ""
    model: "mock"
    temperature: 0.7
    max_tokens: 8192
    timeout: 120.0

embedding:
  type: 'mock'

# ==============================================================================
# SECTION 2.5: Memory Configuration (记忆配置)
# ==============================================================================
# This example is intentionally fully offline.  Declaring memory explicitly is
# important when it is launched as a web template: otherwise project defaults
# can select the configured MindMemOS backend.
memory:
  enabled: false
  type: "local_yaml"
  persist: false
  auto_extraction:
    enabled: false

# ==============================================================================
# SECTION 3: Coder Configuration (代码生成器配置)
# ==============================================================================
coder:
  # --- Coder Type ---
  type: "custom"
  provider: "mock"

  # --- Generation Parameters ---
  timeout: 300.0
  max_retries: 2
  temperature: 0.7
  max_gen_tokens: 4096
  context_max_tokens: 4096
  default_extension: "py"
  log_to_console: false

  # --- Prompt Template ---
  prompt_template: null

# ==============================================================================
# SECTION 4: Planner Configuration (规划器配置)
# ==============================================================================
planner:
  type: "llm_evolution"
  provider: "mock"

  # Selection strategies
  selection_strategy: "weighted"
  parent_selection_strategy: "tournament"

  # Build configuration
  build:
    script: {}

  # Samplers
  samplers:
    - name: "init_sampler"
    - name: "mutation_sampler"
    - name: "crossover_sampler"

# ==============================================================================
# SECTION 5: Evaluator Configuration (评估器配置)
# ==============================================================================
evaluator:
  # --- Evaluator Type ---
  type: "custom"

  # Custom evaluator module path
  module: "tsp_evaluator.py:PythonTSPEvaluator"

  # --- Execution Settings ---
  timeout: 60.0
  max_retries: 1
  parallel: true
  batch_size: 10

  # --- Dataset Configuration ---
  dataset:
    mode: "directory"
    path: "data/small"
    recursive: false

  # --- Metrics ---
  metrics:
    - "tour_length"
    - "execution_time_ms"

# ==============================================================================
# SECTION 6: Evolution Configuration (进化算法配置)
# ==============================================================================
evolution:
  # --- Evolution Type ---
  type: "island_ga"

  # --- Common Parameters ---
  max_generations: 4
  early_stop_patience: 20
  early_stop_threshold: 0.000001
  checkpoint_interval: 10
  max_checkpoints: 5

  # --- Island GA Parameters ---
  elite_ratio: 0.1
  mutation_rate: 0.3
  crossover_rate: 0.5
  parent_selection_strategy: "tournament"
  survival_selection_strategy: "truncation"
  tournament_size: 3

  # Island-specific
  num_islands: 2
  island_population_size: 4
  migration_interval: 5
  migration_rate: 0.1
  migration_strategy: "random"
  migration_topology: "full"
  parallel_islands: true

  # --- Display ---
  human_readable_timing: true

# ==============================================================================
# SECTION 7: Multimodal Configuration (多模态配置)
# ==============================================================================
multimodal:
  enabled: false
  max_images_per_prompt: 3
  image_max_size_kb: 512
  include_observation_text: true
  two_step_refinement: false
  behavior_storage: "rendered"

# ==============================================================================
# SECTION 8: Logging Configuration (日志配置)
# ==============================================================================
logging:
  level: "INFO"
  format: null
  file: null
  console: true
  json_format: false

# ==============================================================================
# SECTION 9: Version Control Configuration (版本控制配置)
# ==============================================================================
version_control:
  enabled: true
  type: "git_worktree"
  local_path: "tsp_algorithm"
  remote_url: null
  revision: null
  auto_initialize: true
  auto_cleanup: true
  max_worktree_age_days: 7
  max_worktrees: 100
  default_branch: "main"
  commit_message_template: "Algorithm {algorithm_id}: {description}"

# ==============================================================================
# SECTION 10: Repository Analyzer Configuration (仓库分析器配置)
# ==============================================================================
repo_analyzer:
  type: "evolve_detector"
  context_lines_before: 5
  context_lines_after: 5
  include:
    - "*.py"
  exclude:
    - ".git/**"
    - "__pycache__/**"
    - "*.pyc"
