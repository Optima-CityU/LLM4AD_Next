# Draft template: choose an evaluation benchmark and LLM provider in the web wizard.
# An automatic pool can wait for authorized devices after its contract is selected.
project_name: hgamey_shader
description_en: "Optimize a Genshin upscaling shader using either fixed-image GPU measurements or weighted real-game A/B measurements on an authorized Android device."
description_zh: "在授权 Android 设备上优化原神超分着色器，可选择固定图片 GPU 评估或真实游戏 A/B 加权评估。"
random_seed: 42
base_dir: ./runs

background: |
  Evolve shader.comp for single-frame super-resolution on an authorized
  remote GPU. The original seed is a bilinear
  upscaler with half-pixel-centered coordinates and clamped border sampling.
  Choose one evaluator in the wizard. The static evaluator measures GPU
  operator_latency_ms and psnr_db against fixed reference images, automatically
  enforces the fixed PSNR constraints and scores same-run baseline-relative
  latency improvement (%). It never launches Genshin.
  The paired static dataset profile uses native 2x RGB pairs from QRISP and
  GameIR-SR, requires nonnegative mean PSNR change in both datasets, and scores
  their equally weighted per-frame latency improvements. Its image attachments
  contain one representative comparison collage per dataset.
  The game evaluator injects the compiled layer into Genshin and scores a
  frozen weighted combination of A/B FPS, frame presentation P95, GPU activity
  per presented frame and official quality penalties, with default weights
  0.25, 0.35, 0.20 and 0.20. Unverified quality or any excess beyond official
  quality reference lines automatically caps fitness at quality_gap_score
  (default -100.0), preserving any lower measured score. Missing quality gives
  that low score when performance is complete. It remains a valid completed
  evaluation and the automated pipeline continues without manual review.
  Missing positive-weight performance measurements still prevent scoring;
  inputs never become zero and weights never change for that candidate.
  After game performance collection, each recorded input frame is replayed on
  the phone GPU by the exact baseline and candidate compute programs. Three
  independent GPU outputs per program establish official IQ for that same input.
  Different input frames are judged separately; normalized frame penalties are
  averaged. Raw game screenshots provide execution context, while replay input,
  GPU outputs and official IQ reports provide the quality evidence. Replay timing
  does not enter game performance, and the score does not establish overall visual quality.
  Static gains do not demonstrate game FPS gains; the weighted game score
  is not a statistical significance test. Both preserve their measurement
  reports, restoration evidence and actual image comparisons in node metadata.
  Each candidate uses the selected evaluator, with no elite reevaluation.

  Modify only the EVOLVE_START / EVOLVE_END region in shader.comp. Keep
  #version 450 and the descriptor interface outside that region unchanged:
  set 0 binding 0 is a readonly rgba8 image2D input_image; set 0 binding 1
  is a writeonly rgba8 image2D output_image. No samplers, push constants,
  extra resources, host-side code or model-generated SPIR-V are accepted.
  Read dimensions with imageSize. Every valid output pixel must be written
  with a defined RGBA value; clamp all source coordinates to input bounds
  and guard out-of-bounds output invocations, including partial edge tiles.

  The trusted runner dispatches (ceil(output_width / 16),
  ceil(output_height / 16), 1) workgroups, independent of candidate code.
  The game evaluator's storage-to-fragment adapter requires local_size
  (16, 16, 1) exactly. Keep this declaration unchanged for game evaluation;
  other sizes are rejected before device execution. Helper functions and
  main remain evolvable within the marked region.
  For the static evaluator, local_size may change. If pixel assignment changes, map
  each dispatched workgroup to its fixed 16-by-16 output tile and use
  strided loops as needed to preserve full coverage without overlapping
  writes. A smaller local_size with unchanged global-ID indexing leaves
  holes and is invalid. Avoid barriers after nonuniform early returns.

  The immutable bilinear baseline, benchmark image inputs,
  input/output sizes, quality thresholds, compiler, device profile, timing
  protocol and dispatch grid belong to the gateway, outside this candidate.
  Do not tune measurement conditions or hardcode reference image contents.
  Compilation and SPIR-V validation occur on the gateway before submission.
  Interpret measured latency and quality within the selected benchmark's scope.

# The existing wizard binds a configured provider; no credentials are packaged.
providers: []

coder:
  type: custom
  provider: default
  timeout: 300.0
  max_retries: 2
  temperature: 0.7
  context_max_tokens: 24000
  max_gen_tokens: 8192
  default_extension: comp
  log_to_console: false

planner:
  type: llm_evolution
  provider: default
  selection_strategy: weighted
  parent_selection_strategy: tournament
  mask_evolve_blocks: false
  samplers:
    - name: init_sampler
      config:
        max_tokens: 4096
    - name: mutation_sampler
      config:
        max_tokens: 4096
    - name: crossover_sampler
      config:
        max_tokens: 4096

evaluator:
  type: remote
  # Select a connected gateway and evaluator before launching the task.
  gateway_id: null
  contract: {}
  parameters: {}
  candidate_paths: [shader.comp]
  # Active budget covers compilation, measurement and cleanup, excluding platform queue time.
  timeout: 7200.0
  max_retries: 1
  parallel: true
  batch_size: 10
  dataset:
    mode: files
    files: []

evolution:
  type: diverse_island_ga
  max_generations: 3
  population_size: 6
  num_islands: 2
  island_population_size: 3
  parallel_islands: false
  max_llm_concurrency: 1
  elite_ratio: 0.34
  mutation_rate: 0.6
  crossover_rate: 0.4
  tournament_size: 2
  parent_selection_strategy: tournament
  survival_selection_strategy: truncation
  migration_interval: 2
  migration_rate: 0.34
  migration_strategy: best
  migration_topology: ring
  adaptive_migration: true
  migration_stagnation_threshold: 2
  elite_reevaluation_count: 0
  early_stop_patience: 3
  early_stop_threshold: 0.000001
  checkpoint_interval: 1
  max_checkpoints: 3

# Memory is opt-in after the user configures a supported memory backend.
memory:
  enabled: false

multimodal:
  enabled: false

version_control:
  enabled: true
  type: git_worktree
  # Cloud task downloads remove the template's top-level directory.
  local_path: algorithm
  auto_initialize: true
  auto_cleanup: true
  default_branch: main

repo_analyzer:
  type: evolve_detector
  context_lines_before: 8
  context_lines_after: 2
  include: ["*.comp"]
  exclude: [".git/**", "*.spv"]

logging:
  level: INFO
  console: true
