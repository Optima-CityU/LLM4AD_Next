project_name: alphaevolve_sums_differences
path_resolution: cwd
description_en: Maximize the fixed finite-set logarithmic ratio variant used by get_score.
description_zh: 最大化固定get_score定义的有限整数集合对数比值变体。
random_seed: 42
background: |
  Maximize the finite-integer-set logarithmic ratio variant used by the existing scorer.
  This benchmark variant is not the AlphaEvolve paper's C6 construction bound.
  For the unique set A of integer-converted output entries, let n=|A|>=2,
  S=|A+A| and D=|A-A|. Maximize the exact fixed objective
  F(A)=log(S/n)/log(D/n)+(1-1/n)/100.
  Do not replace this formula with its reciprocal or with a C6 bound. The set
  size is selectable and the formula, including its finite-size correction,
  is authoritative; generic advice to enlarge D while shrinking S is not the
  objective here. Implement search_for_best_set(), returning (values,strategy).
  values must be a NumPy array of finite integer-convertible values, preferably
  integer dtype; strategy is a short string. The immutable get_score() outside
  the block computes this objective and may be called during search. Preserve
  it and the fixed JSON wrapper; do not redefine the score function.
providers:
- name: default
  type: openai_compatible
  base_url: ${LLM_BASE_URL}
  api_key: ${LLM_API_KEY}
  model: ${LLM_MODEL}
  temperature: 1.0
  max_tokens: 8192
  timeout: 600.0
coder:
  type: custom
  provider: default
  temperature: 1.0
  timeout: 600.0
  max_retries: 2
  max_gen_tokens: 4096
  context_max_tokens: 8192
  default_extension: py
  prompt_template: Implement the experiment task exactly as specified in the problem background. Improve
    only search_for_best_set() inside the EVOLVE block in solve.py. Use the fixed get_score() outside
    that block as the sole candidate objective; do not redefine it. Preserve the final JSON adapter.
planner:
  type: llm_evolution
  provider: default
  selection_strategy: weighted
  parent_selection_strategy: tournament
  build:
    script: {}
  samplers:
  - name: init_sampler
  - name: mutation_sampler
  - name: crossover_sampler
evaluator:
  type: custom
  module: sums_differences/evaluator.py:SumsDifferencesEvaluator
  timeout: 1200.0
  max_retries: 0
  parallel: true
  batch_size: 5
  metrics:
  - get_score_result
  - target_value
  - validity
  - eval_time
evolution:
  type: island_ga
  max_generations: 20
  early_stop_patience: 21
  checkpoint_interval: 5
  elite_ratio: 0.2
  mutation_rate: 0.3
  crossover_rate: 0.5
  num_islands: 3
  island_population_size: 5
  migration_interval: 3
  migration_rate: 0.2
  parallel_islands: true
version_control:
  enabled: true
  type: git_worktree
  local_path: sums_differences/algorithm
  auto_initialize: true
  auto_cleanup: true
  default_branch: main
repo_analyzer:
  type: evolve_detector
  include:
  - '*.py'
  exclude:
  - .git/**
  - __pycache__/**
  - '*.pyc'
