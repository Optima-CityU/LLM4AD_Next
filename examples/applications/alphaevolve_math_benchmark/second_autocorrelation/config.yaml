project_name: alphaevolve_second_autocorrelation
path_resolution: cwd
description_en: Evolve a non-negative 50-step function that maximizes the second autocorrelation lower
  bound.
description_zh: 进化由 50 段非负高度组成的阶梯函数，最大化第二自相关不等式下界。
random_seed: 42
background: |
  Maximize the second-autocorrelation lower bound from 50 heights.
  Implement optimize_lower_bound(), returning (heights, c_lower_bound), where
  heights is a JSON-native list of exactly 50 finite nonnegative numbers with
  at least one positive entry. Let c = convolve(heights,heights), M=len(c)=99,
  and v=[0,*c,0]. On M+1 equal intervals of [-0.5,0.5], define
  L2_squared = sum((v[i]**2+v[i]*v[i+1]+v[i+1]**2)/(3*(M+1))),
  L1 = sum(abs(c))/(M+1), and Linf=max(abs(c)). Maximize
  c_lower_bound = L2_squared/(L1*Linf). This ratio is invariant to positive
  rescaling of the heights. Return a correctly computed finite scalar together
  with the list; the evaluator independently recomputes it and checks roundoff.
  No cal_lower_bound() or verify_heights_sequence() helper is supplied. Implement
  helpers inside the evolvable block and preserve the fixed JSON wrapper.
providers:
- name: default
  type: openai_compatible
  base_url: ${LLM_BASE_URL}
  api_key: ${LLM_API_KEY}
  model: ${LLM_MODEL}
  temperature: 1.0
  max_tokens: 8192
  timeout: 600.0
coder:
  type: custom
  provider: default
  temperature: 1.0
  timeout: 600.0
  max_retries: 2
  max_gen_tokens: 4096
  context_max_tokens: 8192
  default_extension: py
  prompt_template: Implement the experiment task exactly as specified in the problem background. Improve
    only the EVOLVE block in solve.py. Preserve the optimize_lower_bound() entry point and the final JSON
    adapter.
planner:
  type: llm_evolution
  provider: default
  selection_strategy: weighted
  parent_selection_strategy: tournament
  build:
    script: {}
  samplers:
  - name: init_sampler
  - name: mutation_sampler
  - name: crossover_sampler
evaluator:
  type: custom
  module: second_autocorrelation/evaluator.py:SecondAutocorrelationEvaluator
  timeout: 1200.0
  max_retries: 0
  parallel: true
  batch_size: 5
  metrics:
  - c_lower_bound
  - target_ratio
  - validity
  - eval_time
evolution:
  type: island_ga
  max_generations: 20
  early_stop_patience: 21
  checkpoint_interval: 5
  elite_ratio: 0.2
  mutation_rate: 0.3
  crossover_rate: 0.5
  num_islands: 3
  island_population_size: 5
  migration_interval: 3
  migration_rate: 0.2
  parallel_islands: true
version_control:
  enabled: true
  type: git_worktree
  local_path: second_autocorrelation/algorithm
  auto_initialize: true
  auto_cleanup: true
  default_branch: main
repo_analyzer:
  type: evolve_detector
  include:
  - '*.py'
  exclude:
  - .git/**
  - __pycache__/**
  - '*.pyc'
