project_name: alphaevolve_max_min_distance_ratio
path_resolution: cwd
description_en: Evolve 16 planar points that minimize the squared ratio of maximum to minimum pairwise
  distance.
description_zh: 进化 16 个平面点，最小化最大点距与最小点距之比的平方。
random_seed: 42
background: |
  Minimize the squared maximum-to-minimum distance ratio of 16 planar points.
  Implement optimize_construct(n=16,d=2), returning exactly (points,ratio_squared).
  points must be a finite NumPy array of shape (16,2) with distinct points.
  Let dmax and dmin be the largest and smallest pairwise Euclidean distances;
  the raw objective ratio_squared=(dmax/dmin)**2 is minimized. Translation,
  rotation and positive uniform scaling do not change it. There is no fixed
  bounding box. The fixed JSON wrapper serializes points and the evaluator
  recomputes the ratio; it does not trust the returned scalar. Preserve the
  fixed wrapper and edit only the marked evolvable block.
providers:
- name: default
  type: openai_compatible
  base_url: ${LLM_BASE_URL}
  api_key: ${LLM_API_KEY}
  model: ${LLM_MODEL}
  temperature: 1.0
  max_tokens: 8192
  timeout: 600.0
coder:
  type: custom
  provider: default
  temperature: 1.0
  timeout: 600.0
  max_retries: 2
  max_gen_tokens: 4096
  context_max_tokens: 8192
  default_extension: py
  prompt_template: Implement the experiment task exactly as specified in the problem background. Improve
    only the EVOLVE block in solve.py. Preserve the optimize_construct(n=16, d=2) entry point and the
    final JSON adapter.
planner:
  type: llm_evolution
  provider: default
  selection_strategy: weighted
  parent_selection_strategy: tournament
  build:
    script: {}
  samplers:
  - name: init_sampler
  - name: mutation_sampler
  - name: crossover_sampler
evaluator:
  type: custom
  module: max_min_distance_ratio/evaluator.py:MaxMinDistanceRatioEvaluator
  timeout: 1200.0
  max_retries: 0
  parallel: true
  batch_size: 5
  metrics:
  - ratio_squared
  - target_ratio
  - validity
  - eval_time
evolution:
  type: island_ga
  max_generations: 20
  early_stop_patience: 21
  checkpoint_interval: 5
  elite_ratio: 0.2
  mutation_rate: 0.3
  crossover_rate: 0.5
  num_islands: 3
  island_population_size: 5
  migration_interval: 3
  migration_rate: 0.2
  parallel_islands: true
version_control:
  enabled: true
  type: git_worktree
  local_path: max_min_distance_ratio/algorithm
  auto_initialize: true
  auto_cleanup: true
  default_branch: main
repo_analyzer:
  type: evolve_detector
  include:
  - '*.py'
  exclude:
  - .git/**
  - __pycache__/**
  - '*.pyc'
