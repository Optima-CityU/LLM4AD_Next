project_name: alphaevolve_heilbronn_triangle_n11
path_resolution: cwd
description_en: Evolve 11 points in an equilateral triangle to maximize the minimum normalized triangle
  area.
description_zh: 进化等边三角形内的 11 个点，最大化任意三点形成三角形的最小归一化面积。
random_seed: 42
background: |
  Maximize the normalized smallest triangle area for 11 points in an equilateral triangle.
  The coordinate triangle has vertices (0,0), (1,0), (0.5,sqrt(3)/2), hence area
  sqrt(3)/4. All 11 finite distinct points must lie in this closed triangle and
  no triple may be collinear. For each triple compute its ordinary triangle
  area; the raw objective min_area is the minimum of those areas divided by
  sqrt(3)/4, representing an enclosing triangle scaled to unit area.
  Implement the evolvable run_search_point(n=11), returning (points,min_area).
  points must be a JSON-native list of 11 two-element coordinate lists;
  min_area must be a finite Python scalar. The evaluator recomputes the objective
  from points and does not trust the supplied value. This function is inside
  the evolvable block; preserve the separate fixed JSON main adapter.
  Closed-triangle half-space boundary checks allow an absolute residual of 1e-12 for roundoff. Genuine exterior points and degenerate constructions remain invalid.
providers:
- name: default
  type: openai_compatible
  base_url: ${LLM_BASE_URL}
  api_key: ${LLM_API_KEY}
  model: ${LLM_MODEL}
  temperature: 1.0
  max_tokens: 8192
  timeout: 600.0
coder:
  type: custom
  provider: default
  temperature: 1.0
  timeout: 600.0
  max_retries: 2
  max_gen_tokens: 4096
  context_max_tokens: 8192
  default_extension: py
  prompt_template: Implement the experiment task exactly as specified in the problem background. Improve
    only the EVOLVE block in solve.py. Preserve the run_search_point(n=11) entry point and the final JSON
    adapter.
planner:
  type: llm_evolution
  provider: default
  selection_strategy: weighted
  parent_selection_strategy: tournament
  build:
    script: {}
  samplers:
  - name: init_sampler
  - name: mutation_sampler
  - name: crossover_sampler
evaluator:
  type: custom
  module: heilbronn_triangle/evaluator.py:HeilbronnTriangleEvaluator
  timeout: 1200.0
  max_retries: 0
  parallel: true
  batch_size: 5
  metrics:
  - min_area
  - target_ratio
  - validity
  - eval_time
evolution:
  type: island_ga
  max_generations: 20
  early_stop_patience: 21
  checkpoint_interval: 5
  elite_ratio: 0.2
  mutation_rate: 0.3
  crossover_rate: 0.5
  num_islands: 3
  island_population_size: 5
  migration_interval: 3
  migration_rate: 0.2
  parallel_islands: true
version_control:
  enabled: true
  type: git_worktree
  local_path: heilbronn_triangle/algorithm
  auto_initialize: true
  auto_cleanup: true
  default_branch: main
repo_analyzer:
  type: evolve_detector
  include:
  - '*.py'
  exclude:
  - .git/**
  - __pycache__/**
  - '*.pyc'
