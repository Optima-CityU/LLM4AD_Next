evaluator: {type: "custom", module: "minimum_overlap/evaluator.py:MinimumOverlapEvaluator", timeout: 1200.0, max_retries: 0, parallel: true, batch_size: 5, metrics: [upper bound, target_upper_bound, validity, eval_time]}
