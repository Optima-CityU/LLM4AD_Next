project_name: alphaevolve_minimum_overlap
path_resolution: cwd
description_en: Evolve a symmetric relaxed sequence that minimizes its maximum normalized overlap with
  its complement.
description_zh: 进化对称松弛序列，最小化该序列与其补序列的最大归一化重叠。
random_seed: 42
background: |
  Minimize the relaxed symmetric minimum-overlap sequence objective.
  Implement generate_erdos_data(), returning a JSON-native list h with at least
  two finite entries. The evaluator constructs s=concatenate(h[:-1],h[::-1]).
  Every value of s must lie in [0,1] and sum(s) must equal len(s)/2 within the
  documented numerical tolerance. The raw objective named 'upper bound' is
  2*max(numpy.correlate(s,1-s,mode='full'))/len(s); smaller is better.
  The half-sequence length is selectable. Return h itself, not its score.
  The fixed main calls json.dumps directly, so return plain lists and Python
  numeric values rather than an ndarray. Preserve all code outside the block.
providers:
- name: default
  type: openai_compatible
  base_url: ${LLM_BASE_URL}
  api_key: ${LLM_API_KEY}
  model: ${LLM_MODEL}
  temperature: 1.0
  max_tokens: 8192
  timeout: 600.0
coder:
  type: custom
  provider: default
  temperature: 1.0
  timeout: 600.0
  max_retries: 2
  max_gen_tokens: 4096
  context_max_tokens: 8192
  default_extension: py
  prompt_template: Implement the experiment task exactly as specified in the problem background. Improve
    only the EVOLVE block in solve.py. Preserve the generate_erdos_data() entry point and the final JSON
    adapter.
planner:
  type: llm_evolution
  provider: default
  selection_strategy: weighted
  parent_selection_strategy: tournament
  build:
    script: {}
  samplers:
  - name: init_sampler
  - name: mutation_sampler
  - name: crossover_sampler
evaluator:
  type: custom
  module: minimum_overlap/evaluator.py:MinimumOverlapEvaluator
  timeout: 1200.0
  max_retries: 0
  parallel: true
  batch_size: 5
  metrics:
  - upper bound
  - target_upper_bound
  - validity
  - eval_time
evolution:
  type: island_ga
  max_generations: 20
  early_stop_patience: 21
  checkpoint_interval: 5
  elite_ratio: 0.2
  mutation_rate: 0.3
  crossover_rate: 0.5
  num_islands: 3
  island_population_size: 5
  migration_interval: 3
  migration_rate: 0.2
  parallel_islands: true
version_control:
  enabled: true
  type: git_worktree
  local_path: minimum_overlap/algorithm
  auto_initialize: true
  auto_cleanup: true
  default_branch: main
repo_analyzer:
  type: evolve_detector
  include:
  - '*.py'
  exclude:
  - .git/**
  - __pycache__/**
  - '*.pyc'
