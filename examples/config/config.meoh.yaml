project_name: "meoh_example"
base_dir: "./runs"
background: |
  Design and iteratively improve an algorithm inside the EVOLVE block.

providers:
  - name: "default"
    type: "openai_compatible"
    base_url: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    model: "${OPENAI_MODEL}"

evaluator:
  module: "examples/applications/tsp_benchmark_python/tsp_evaluator.py:PythonTSPEvaluator"
  dataset:
    mode: "directory"
    path: "examples/applications/tsp_benchmark_python/data/small"
    recursive: false

coder:
  type: "custom"
  provider: "default"

version_control:
  enabled: true
  type: "git_worktree"
  local_path: "./examples/applications/tsp_benchmark_python/tsp_algorithm"

repo_analyzer:
  type: "evolve_detector"

evolution:
  type: "meoh"
  planner_type: "meoh_evolution"
  max_generations: 5
  population_size: 8
  selection_num: 2
  max_sample_nums: 32
  objective_metrics:
    - "tour_length"
    - "candidate_runtime_ms"
  code_generation_mode: "reuse_coder"
  active_population_ratio: 0.25
  use_e2_operator: true
  use_m1_operator: true
  use_m2_operator: true
